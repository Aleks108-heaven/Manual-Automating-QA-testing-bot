# Once a week: known vulnerabilities and registry signatures of every installed package.
# It only reports. A failed run is the signal to follow docs/runbooks/updates.md. It never changes the repository.
name: supply-chain

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit, not a tag (a tag can be moved). Dependabot keeps these current.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      # Install scripts stay off through .npmrc. No browser is needed for these two checks.
      - run: npm ci
      - run: npm run check:pins
      # Run the script directly: npm refuses to run `npm audit` nested inside an npm script (see scripts/supply-chain.ts).
      - run: node scripts/supply-chain.ts
