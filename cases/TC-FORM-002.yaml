id: TC-FORM-002
title: Accept a valid email with a plus sign, capitals and a subdomain
priority: P1
technique: equivalence partitioning
risk: RISK-FORM-VALIDATION   # fixture risk ID
role: none
preconditions:
  - The newsletter form is available at /form
data:
  valid_email: "User+Tag@Mail.Example.co"
allowed_mutations:
  - POST /api/subscribe
steps:
  - open /form                                              # 1
  - fill the Email field with data.valid_email              # 2
  - click the Subscribe button                              # 3
expected:
  - id: e1
    after_step: 3
    kind: text_visible
    where: {role: status}
    text: "Thanks for subscribing"
    exact: true
    description: The confirmation message is shown
  - id: e2
    after_step: 3
    kind: status
    request: "POST /api/subscribe"
    status: 200
    description: The server accepted the submission
  - id: e3
    after_step: 3
    kind: count
    where: {role: alert}
    equals: 0
    description: No error message is shown
